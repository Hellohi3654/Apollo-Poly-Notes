<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="tab_title">Dashboard</title>

  <!-- Google Fonts & Stylesheets -->
  <link href="https://fonts.googleapis.com/css?family=Shadows+Into+Light" rel="stylesheet" type="text/css">
  <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="stylesheet" type="text/css" href="css/new_tab_style.css">

  <!-- Scripts -->
  <script type="text/javascript" src="js/jquery-2.2.4.min.js"></script>
  <script type="text/javascript" src="js/jquery.mousewheel.min.js"></script>
  <script type="text/javascript" src="js/new_tab_script.js"></script>
  <script type="text/javascript" src="js.js"></script>
</head>
<body>

  <div class="dashboard-layout">
    
    <!-- Expanded Dedicated Sidebar -->
    <aside class="sidebar">
      
      <!-- Electricity Price Bar (Wrapped to allow vertical offset) -->
      <div class="gridiq-container">
        <iframe
          class="gridiq-widget"
          src="https://gridiq.com.au/embed/prices"
          title="Live NEM + WEM electricity prices"
          loading="lazy">
        </iframe>
      </div>

      <!-- Main Fuel Type Chart Container -->
      <div class="chart-container">
        <iframe 
          class="power-window" 
          src="https://ausrealtimefueltype.global-roam.com"
          title="Aus Realtime Fuel Type">
        </iframe>
      </div>

      <!-- Bottom Control Bar (Buttons Only) -->
      <div class="sidebar-footer">
        <nav class="nav-buttons">
          <a href="https://youtube.com/" class="button1" title="YouTube">
            <img src="google_youtube.png" alt="YouTube" />
          </a>
          <a href="https://reddit.com/" class="button2" title="Reddit">
            <img src="app_reddit_og.png" alt="Reddit" />
          </a>
          <a href="https://openelectricity.org.au/" class="button3" title="Open Electricity">
            <img src="https://platform.openelectricity.org.au/logo/oe-icon-black.svg" alt="Open Electricity" style="border-radius: 5px;"/>
          </a>
          <a href="https://www.ozbargain.com.au/" class="button4" title="OzBargain">
            <img src="https://files.delvu.com/images/ozbargain/logo/Square%20Flat.png" alt="OzBargain" style="border-radius: 5px;" />
          </a>
        </nav>
      </div>

    </aside>

    <!-- Photo Display Stage -->
    <main id="bgphoto2">
      <!-- Floating Clock Widget -->
      <footer id="time-wrapper">
        <div id="time"></div>
        <div id="date"></div>
      </footer>

      <div class="photo2"></div>
    </main>

  </div>

</body>
</html>
